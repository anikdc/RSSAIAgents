[project]
name = "rssaiagents"
version = "0.1.0"
description = "AI news trend briefing pipeline with RSS polling, clustering, verification, and Streamlit UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "feedparser",
    "google-genai",
    "hdbscan",
    "lxml",
    "numpy",
    "python-dotenv",
    "requests",
    "scikit-learn>=1.3",
    "sentence-transformers",
    "streamlit",
]

[project.optional-dependencies]
groq = [
    "groq",
]

[tool.uv]
package = false
